<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meter Data Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .controls {
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
        }
        
        button {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #667eea;
            color: white;
        }
        
        button.active {
            background: #667eea;
            color: white;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            font-weight: 600;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-top: 5px;
        }
        
        .table-wrapper {
            padding: 30px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        thead {
            background: #f8f9fa;
            border-top: 2px solid #667eea;
            border-bottom: 2px solid #667eea;
        }
        
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .site-name {
            font-weight: 600;
            color: #667eea;
        }
        
        .number {
            text-align: right;
            font-family: 'Courier New', monospace;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            color: #d32f2f;
            padding: 20px;
            background: #ffebee;
            border-radius: 6px;
            margin: 20px;
        }
        
        .date-display {
            font-size: 13px;
            color: #666;
        }
        
        .footer {
            padding: 20px 30px;
            text-align: center;
            color: #999;
            font-size: 12px;
            border-top: 1px solid #eee;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
            
            table {
                font-size: 12px;
            }
            
            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Meter Data Dashboard</h1>
            <p>Real-time electricity meter data for all sites</p>
        </div>
        
        <div class="controls">
            <div class="btn-group">
                <button class="active" onclick="refreshData()">🔄 Refresh Data</button>
                <button onclick="downloadExcel()">📥 Download JSON</button>
            </div>
            <div class="date-display">
                Cập nhật: <span id="lastUpdate">-</span>
            </div>
        </div>
        
        <div id="statsContainer" class="stats" style="padding: 0 30px 20px; margin-top: 20px;"></div>
        
        <div class="table-wrapper">
            <div id="content">
                <div class="loading">Đang tải dữ liệu...</div>
            </div>
        </div>
        
        <div class="footer">
            <p>Hệ thống theo dõi tiêu thụ điện năng • Data from GitHub</p>
        </div>
    </div>
    
    <script>
        // GitHub raw content URL
        const GITHUB_DATA_URL = 'https://raw.githubusercontent.com/dampm149-oss/meter-data/main/data.json';
        
        let cachedData = null;
        
        async function loadData() {
            try {
                const response = await fetch(GITHUB_DATA_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                cachedData = await response.json();
                
                // Update last update time
                document.getElementById('lastUpdate').textContent = 
                    new Date().toLocaleString('vi-VN');
                
                // Render stats
                renderStats(cachedData);
                
                // Render table
                renderTable(cachedData);
                
            } catch (error) {
                const content = document.getElementById('content');
                content.innerHTML = `
                    <div class="error">
                        ❌ Lỗi: ${error.message}<br>
                        <small>Kiểm tra kết nối internet hoặc GitHub có online không?</small>
                    </div>
                `;
            }
        }
        
        function refreshData() {
            document.getElementById('content').innerHTML = '<div class="loading">Đang tải dữ liệu...</div>';
            loadData();
        }
        
        function renderStats(data) {
            const statsContainer = document.getElementById('statsContainer');
            
            const totalMeters = data.data ? data.data.length : 0;
            const totalConsumption = data.data ? 
                data.data.reduce((sum, row) => sum + (row.ACTIVE_TOTAL || 0), 0) : 0;
            
            statsContainer.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Ngày</div>
                    <div class="stat-value">${data.date}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Tổng công tơ</div>
                    <div class="stat-value">${totalMeters}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Tổng tiêu thụ (kWh)</div>
                    <div class="stat-value">${totalConsumption.toLocaleString('vi-VN', {maximumFractionDigits: 0})}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Trung bình/công tơ</div>
                    <div class="stat-value">${(totalConsumption/totalMeters).toLocaleString('vi-VN', {maximumFractionDigits: 0})}</div>
                </div>
            `;
        }
        
        function renderTable(data) {
            const content = document.getElementById('content');
            
            if (!data.data || data.data.length === 0) {
                content.innerHTML = '<p style="padding: 20px; color: #999;">Không có dữ liệu</p>';
                return;
            }
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th style="width: 50px;">STT</th>
                            <th style="width: 150px;">Công tơ</th>
                            <th style="width: 250px;">Site</th>
                            <th style="width: 120px;">Sản lượng (kWh)</th>
                            <th style="width: 120px;">Rate 1 (kWh)</th>
                            <th style="width: 120px;">Rate 2 (kWh)</th>
                            <th style="width: 80px;">Record</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            data.data.forEach(row => {
                const activeTotal = row.ACTIVE_TOTAL || 0;
                const rate1 = row.ACTIVE_KW_INDICATE_RATE1 || 0;
                const rate2 = row.ACTIVE_KW_INDICATE_RATE2 || 0;
                
                html += `
                    <tr>
                        <td>${row.stt}</td>
                        <td><code style="background: #f0f0f0; padding: 2px 6px; border-radius: 3px;">${row.meter_no}</code></td>
                        <td><span class="site-name">${row.site}</span></td>
                        <td class="number"><strong>${activeTotal.toLocaleString('vi-VN', {maximumFractionDigits: 2})}</strong></td>
                        <td class="number">${rate1.toLocaleString('vi-VN', {maximumFractionDigits: 2})}</td>
                        <td class="number">${rate2.toLocaleString('vi-VN', {maximumFractionDigits: 2})}</td>
                        <td class="number">${row.records_count || '-'}</td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
            `;
            
            content.innerHTML = html;
        }
        
        function downloadExcel() {
            if (!cachedData) {
                alert('Vui lòng load dữ liệu trước!');
                return;
            }
            const dataStr = JSON.stringify(cachedData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `meter_data_${cachedData.date}.json`;
            a.click();
        }
        
        // Load data on page load
        loadData();
    </script>
</body>
</html>
