<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meter Data Dashboard - Advanced</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }
        
        .control-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
            align-items: end;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input[type="date"],
        select {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }
        
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }
        
        .table-wrapper {
            padding: 30px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        thead {
            background: #f8f9fa;
            border-top: 2px solid #667eea;
            border-bottom: 2px solid #667eea;
        }
        
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .site-name {
            font-weight: 600;
            color: #667eea;
        }
        
        .meter-id {
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
        }
        
        .number {
            text-align: right;
            font-family: 'Courier New', monospace;
        }
        
        .no-data {
            text-align: center;
            color: #999;
            font-style: italic;
        }
        
        .status-ok {
            color: #4caf50;
            font-weight: 600;
        }
        
        .status-no-data {
            color: #f44336;
            font-weight: 600;
        }
        
        .status-partial {
            color: #ff9800;
            font-weight: 600;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            color: #d32f2f;
            padding: 20px;
            background: #ffebee;
            border-radius: 6px;
            margin: 20px;
            border-left: 4px solid #d32f2f;
        }
        
        .footer {
            padding: 20px 30px;
            text-align: center;
            color: #999;
            font-size: 12px;
            border-top: 1px solid #eee;
        }
        
        @media (max-width: 768px) {
            .control-group {
                grid-template-columns: 1fr;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
            
            table {
                font-size: 12px;
            }
            
            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Meter Data Dashboard</h1>
            <p>Real-time electricity meter data query and export</p>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" id="startDate">
                </div>
                
                <div class="form-group">
                    <label>End Date (Max 1 month)</label>
                    <input type="date" id="endDate">
                </div>
                
                <div class="form-group">
                    <label>Meter ID</label>
                    <select id="meterSelect">
                        <option value="">-- Select Meter --</option>
                    </select>
                </div>
                
                <div class="btn-group">
                    <button class="btn-primary" onclick="fetchData()">🔍 Fetch Data</button>
                    <button class="btn-secondary" onclick="resetForm()">🔄 Reset</button>
                </div>
            </div>
            
            <div id="statsContainer" class="stats" style="display: none;"></div>
        </div>
        
        <div class="table-wrapper">
            <div id="content">
                <p style="color: #999; text-align: center; padding: 40px;">Select dates and meter to fetch data</p>
            </div>
        </div>
        
        <div style="padding: 30px; text-align: right; gap: 10px; display: flex; justify-content: flex-end;">
            <button class="btn-secondary" id="exportBtn" onclick="exportExcel()" style="display: none;">📥 Export Excel</button>
        </div>
        
        <div class="footer">
            <p>Hệ thống theo dõi tiêu thụ điện năng • Real-time Data from Internal API</p>
        </div>
    </div>
    
    <script>
        // Meter list
        const meters = [
            { no: "2410770895", site: "VN1-YISHENG", id: "VD016" },
            { no: "2411320841", site: "VN2-RK RESOURCES", id: "VD019" },
            { no: "2411320925", site: "VN2-RK RESOURCES", id: "VD019" },
            { no: "2411320957", site: "VN2-RK RESOURCES", id: "VD019" },
            { no: "2410770947", site: "VN1-DELSON_S1", id: "VD011" },
            { no: "2410770496", site: "VN1-DELSON_S1", id: "VD011" },
            { no: "2410770519", site: "VN1-WEISHENG", id: "VD015" },
            { no: "2410770533", site: "VN1-KINGDOM", id: "VD014" },
            { no: "2410770525", site: "VN1-KINGDOM", id: "VD014" },
            { no: "2410770851", site: "VN1-JIANG MEN", id: "VD013" },
            { no: "2410770894", site: "VN1-GREAT PROCESS", id: "VD012" },
            { no: "2411320920", site: "VN2-MOCAL CREATIVE", id: "VD018" },
            { no: "2411320977", site: "VN2-MOCAL CREATIVE", id: "VD018" },
            { no: "2410717617", site: "VN2-ChengShin Rubber", id: "VD017" },
            { no: "2510696851", site: "VN3-Alena-1A", id: "VD020" },
            { no: "2510696860", site: "VN3-Alena-1A", id: "VD020" },
            { no: "2510223457", site: "VN3-Amara-1A", id: "VD021" },
            { no: "2510697069", site: "VN3-Amara-1A", id: "VD021" },
        ];
        
        let currentData = null;
        
        // Initialize meter dropdown
        function initMeterSelect() {
            const select = document.getElementById('meterSelect');
            meters.forEach(meter => {
                const option = document.createElement('option');
                option.value = meter.no;
                option.text = `${meter.no} - ${meter.site}`;
                select.appendChild(option);
            });
        }
        
        // Set default dates
        function setDefaultDates() {
            const today = new Date();
            const lastMonth = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
            
            document.getElementById('endDate').valueAsDate = today;
            document.getElementById('startDate').valueAsDate = lastMonth;
        }
        
        // Validate date range (max 1 month)
        function validateDateRange() {
            const startStr = document.getElementById('startDate').value;
            const endStr = document.getElementById('endDate').value;
            
            if (!startStr || !endStr) {
                alert('Please select both start and end dates');
                return false;
            }
            
            const start = new Date(startStr);
            const end = new Date(endStr);
            
            if (start > end) {
                alert('Start date must be before end date');
                return false;
            }
            
            const diffDays = Math.ceil((end - start) / (1000 * 60 * 60 * 24));
            if (diffDays > 30) {
                alert('Maximum date range is 30 days');
                return false;
            }
            
            return true;
        }
        
        // Fetch data from API
        async function fetchData() {
            const meterNo = document.getElementById('meterSelect').value;
            
            if (!meterNo) {
                alert('Please select a meter');
                return;
            }
            
            if (!validateDateRange()) {
                return;
            }
            
            const startDate = document.getElementById('startDate').value.replace(/-/g, '');
            const endDate = document.getElementById('endDate').value.replace(/-/g, '');
            
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Fetching data...</div>';
            
            try {
                const response = await fetch('/api/fetchMeterData', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        startDate: startDate + '000000',
                        endDate: endDate + '235959',
                        meterNo: meterNo
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    content.innerHTML = `<div class="error">❌ Error: ${data.error}<br><small>${data.details || ''}</small></div>`;
                    return;
                }
                
                currentData = data;
                renderResult(data);
                
            } catch (error) {
                content.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        function renderResult(data) {
            const meter = meters.find(m => m.no === data.meter_no);
            const content = document.getElementById('content');
            
            let statusClass = 'status-ok';
            let statusText = '✅ OK';
            
            if (data.status === 'no_data') {
                statusClass = 'status-no-data';
                statusText = '❌ No Data';
            } else if (data.status === 'partial') {
                statusClass = 'status-partial';
                statusText = '⚠️ Partial';
            }
            
            // Render stats
            const statsHtml = `
                <div class="stat-card">
                    <div class="stat-label">Meter</div>
                    <div class="stat-value">${data.meter_no}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Site</div>
                    <div class="stat-value">${meter ? meter.site : 'N/A'}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Status</div>
                    <div class="stat-value ${statusClass}">${statusText}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Records</div>
                    <div class="stat-value">${data.records_count}</div>
                </div>
            `;
            
            document.getElementById('statsContainer').innerHTML = statsHtml;
            document.getElementById('statsContainer').style.display = 'grid';
            
            // Render table
            let tableHtml = `
                <table>
                    <thead>
                        <tr>
                            <th>Meter ID</th>
                            <th>Site</th>
                            <th>Period</th>
                            <th>Active Total (kWh)</th>
                            <th>Rate 1 (kWh)</th>
                            <th>Rate 2 (kWh)</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><span class="meter-id">${data.meter_no}</span></td>
                            <td><span class="site-name">${meter ? meter.site : 'N/A'}</span></td>
                            <td>
                                <small>
                                    ${data.first_time ? data.first_time : 'N/A'}<br>
                                    to<br>
                                    ${data.last_time ? data.last_time : 'N/A'}
                                </small>
                            </td>
                            <td class="number">
                                <strong>${data.status === 'no_data' ? 'No Data' : data.consumption.ACTIVE_TOTAL.toLocaleString('vi-VN', {maximumFractionDigits: 2})}</strong>
                            </td>
                            <td class="number">
                                ${data.status === 'no_data' ? 'No Data' : data.consumption.ACTIVE_KW_INDICATE_RATE1.toLocaleString('vi-VN', {maximumFractionDigits: 2})}
                            </td>
                            <td class="number">
                                ${data.status === 'no_data' ? 'No Data' : data.consumption.ACTIVE_KW_INDICATE_RATE2.toLocaleString('vi-VN', {maximumFractionDigits: 2})}
                            </td>
                            <td><span class="${statusClass}">${statusText}</span></td>
                        </tr>
                    </tbody>
                </table>
            `;
            
            content.innerHTML = tableHtml;
            document.getElementById('exportBtn').style.display = 'block';
        }
        
        function exportExcel() {
            if (!currentData) {
                alert('No data to export');
                return;
            }
            
            const meter = meters.find(m => m.no === currentData.meter_no);
            const data = [
                ['Meter ID', currentData.meter_no],
                ['Site', meter ? meter.site : 'N/A'],
                ['Date Range', `${currentData.start_date} to ${currentData.end_date}`],
                ['Status', currentData.status],
                ['Records Count', currentData.records_count],
                [],
                ['Consumption Type', 'Value (kWh)'],
                ['Active Total', currentData.status === 'no_data' ? 'No Data' : currentData.consumption.ACTIVE_TOTAL.toFixed(2)],
                ['Rate 1', currentData.status === 'no_data' ? 'No Data' : currentData.consumption.ACTIVE_KW_INDICATE_RATE1.toFixed(2)],
                ['Rate 2', currentData.status === 'no_data' ? 'No Data' : currentData.consumption.ACTIVE_KW_INDICATE_RATE2.toFixed(2)],
            ];
            
            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [{wch: 20}, {wch: 20}];
            
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Meter Data');
            
            XLSX.writeFile(wb, `meter_${currentData.meter_no}_${currentData.start_date}_${currentData.end_date}.xlsx`);
        }
        
        function resetForm() {
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            document.getElementById('meterSelect').value = '';
            document.getElementById('content').innerHTML = '<p style="color: #999; text-align: center; padding: 40px;">Select dates and meter to fetch data</p>';
            document.getElementById('statsContainer').style.display = 'none';
            document.getElementById('exportBtn').style.display = 'none';
            currentData = null;
            setDefaultDates();
        }
        
        // Initialize on page load
        window.addEventListener('load', function() {
            initMeterSelect();
            setDefaultDates();
        });
    </script>
</body>
</html>
